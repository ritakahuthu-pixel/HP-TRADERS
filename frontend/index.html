<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HPTraders App</title>

<style>
body {
  margin:0;
  font-family: Inter, sans-serif;
  background:#050d1a;
  color:#fff;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:15px 5%;
  background:#0d1b2e;
  position:sticky;
  top:0;
}
.logo{font-weight:700;color:#00d4ff}

/* BUTTONS */
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
.btn{background:#22c55e;color:#fff}
.btn-outline{background:transparent;border:1px solid #00d4ff;color:#00d4ff}

/* SECTIONS */
section{padding:40px 5%}
.hidden{display:none}

/* LOGIN BOX */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  background:#0d1b2e;
  padding:25px;
  border-radius:12px;
  width:300px;
}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #00d4ff;
  background:#050d1a;
  color:#fff;
}

/* HUB GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.card{
  padding:20px;
  background:#0d1b2e;
  border-radius:12px;
  border:1px solid #112036;
  text-align:center;
}
.card:hover{border-color:#00d4ff}

/* RESPONSIVE */
@media(max-width:600px){
  nav{flex-direction:column;gap:10px}
}
</style>
</head>

<body>

<nav>
  <div class="logo">HPTraders</div>
  <div>
    <button class="btn-outline" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- LOGIN -->
<div id="loginPage" class="modal">
  <div class="box">
    <h3>Login</h3>
    <input id="user" placeholder="Username"/>
    <input id="pass" type="password" placeholder="Password"/>
    <button class="btn" onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- DASHBOARD -->
  <section id="dashboard">
    <h2>Welcome, <span id="name"></span> 👋</h2>
    <p>Choose where to go:</p>

    <button class="btn" onclick="show('hub')">Go to Trading Hub</button>
  </section>

  <!-- HUB -->
  <section id="hub" class="hidden">
    <h2>Trading Hub</h2>

    <div class="grid">
      <div class="card">📊 Live Charts</div>
      <div class="card">🤖 Bot Builder</div>
      <div class="card">🧠 Free AI Bot</div>
      <div class="card">📈 Analytics</div>
      <div class="card">✋ Manual Trader</div>
      <div class="card">📦 Bulk Trader</div>
      <div class="card">💹 HP Markets</div>
      <div class="card">📁 Dashboard</div>
    </div>
  </section>

</div>

<script>

// LOGIN
function login(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if(!u || !p) return alert("Fill all fields");

  localStorage.setItem("hp_user", u);

  document.getElementById("loginPage").style.display="none";
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("name").innerText = u;
}

// LOGOUT
function logout(){
  localStorage.removeItem("hp_user");
  location.reload();
}

// NAV
function show(page){
  document.querySelectorAll("#app section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(page).classList.remove("hidden");
}

// AUTO LOGIN
window.onload = () => {
  const user = localStorage.getItem("hp_user");

  if(user){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("name").innerText = user;
  }
}

</script>

</body>
</html>
