<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DB Traders Dashboard</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Particle Background -->
  <canvas id="particles"></canvas>

  <!-- NAV -->
  <header class="nav">
    <div class="logo">DB TRADERS</div>
    <nav>
      <a href="#">Dashboard</a>
      <a href="#">Bots</a>
      <a href="#">Trades</a>
      <a href="#">Wallet</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Welcome Back, Trader 🚀</h1>
    <p>Monitor bots, automate trades, and track performance in real time.</p>
  </section>

  <!-- CARDS -->
  <section class="grid">
    
    <div class="card">
      <h3>Active Bots</h3>
      <p>3 Running</p>
    </div>

    <div class="card">
      <h3>Total Balance</h3>
      <p>$12,480</p>
    </div>

    <div class="card">
      <h3>Today Profit</h3>
      <p class="profit">+ $340</p>
    </div>

    <div class="card">
      <h3>Market Status</h3>
      <p class="live">LIVE</p>
    </div>

  </section>

  <script src="app.js"></script>
</body>
</html>
