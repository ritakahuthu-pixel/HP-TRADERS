
<!DOCTYPE html>
<html>
<head>
<title>HPTraders Pro Dashboard</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="sidebar">
  <h2>HPTRADERS</h2>
  <button onclick="startBot()">Start Bot</button>
  <button onclick="stopBot()">Stop Bot</button>
</div>

<div class="main">

  <!-- LIVE CHART -->
  <div id="chart"></div>

  <!-- BOT STATUS -->
  <div class="panel">
    <h3>Bot Status</h3>
    <p id="status">Idle</p>
  </div>

  <!-- TRADES -->
  <div class="panel">
    <h3>Trades</h3>
    <div id="trades"></div>
  </div>

</div>

<script src="dashboard.js"></script>

<script>
new TradingView.widget({
  "container_id": "chart",
  "symbol": "BINANCE:BTCUSDT",
  "interval": "1",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "enable_publishing": false
});
</script>

</body>
</html>
