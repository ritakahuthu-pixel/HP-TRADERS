<script>
const API_URL = "https://hp-traders-v5ey.onrender.com";

// Load dashboard data
async function loadDashboard() {
  try {

    // AI Signals
    const aiRes = await fetch(`${API_URL}/api/ai`);
    const aiData = await aiRes.json();

    // Trades
    const tradeRes = await fetch(`${API_URL}/api/trade`);
    const trades = await tradeRes.json();

    // Populate trade table
    const table = document.getElementById("tradeTable");
    table.innerHTML = "";

    trades.forEach(trade => {
      table.innerHTML += `
        <tr>
          <td>${trade.time}</td>
          <td>${trade.asset}</td>
          <td>${trade.type}</td>
          <td>$${trade.stake}</td>
          <td class="${trade.result === 'WIN' ? 'win':'loss'}">
            ${trade.result}
          </td>
        </tr>
      `;
    });

  } catch(err){
    console.error(err);
  }
}

// Start Bot
async function startBot(){

  try{

    const res = await fetch(`${API_URL}/api/bot/start`,{
      method:"POST"
    });

    const data = await res.json();

    document.getElementById("botStatus").innerText =
      "Bot Status: Running";

  }catch(err){
    console.error(err);
  }

}

// Stop Bot
async function stopBot(){

  try{

    const res = await fetch(`${API_URL}/api/bot/stop`,{
      method:"POST"
    });

    const data = await res.json();

    document.getElementById("botStatus").innerText =
      "Bot Status: Stopped";

  }catch(err){
    console.error(err);
  }

}

loadDashboard();
setInterval(loadDashboard,10000);
</script>
