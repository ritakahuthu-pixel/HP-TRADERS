
<!DOCTYPE html>
<html>
<head>
  <title>HP Traders Live</title>
</head>
<body>

<h1>📊 Deriv Live Trading</h1>

<h2 id="price">Loading price...</h2>

<button onclick="trade('CALL')">BUY (CALL)</button>
<button onclick="trade('PUT')">SELL (PUT)</button>

<script>
const eventSource = new EventSource("https://hp-traders-v5ey.onrender.com/api/price-stream");

eventSource.onmessage = (event) => {
  const data = JSON.parse(event.data);
  document.getElementById("price").innerText = "Price: " + data.price;
};

function trade(type) {
  fetch("https://hp-traders-v5ey.onrender.com/api/trade", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      amount: 10,
      contract_type: type
    })
  }).then(res => res.json())
    .then(data => alert(data.message));
}
</script>

</body>
</html>
