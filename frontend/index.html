<!DOCTYPE html>
<html>
<head>
  <title>IQ Trading Terminal</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      height: 100vh;
    }

    .chart iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .panel {
      background: #111a2e;
      padding: 20px;
    }

    .price {
      font-size: 28px;
      color: #00ff99;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .buy { background: green; }
    .sell { background: red; }
    .login { background: #2563eb; }
  </style>
</head>

<body>

<div class="layout">

  <div class="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=1"></iframe>
  </div>

  <div class="panel">

    <h2>IQ Trading</h2>

    <button class="login" onclick="login()">Login</button>

    <h3 id="status">Not logged in</h3>

    <div class="price" id="price">Loading...</div>

    <button class="buy" onclick="trade('CALL')">BUY</button>
    <button class="sell" onclick="trade('PUT')">SELL</button>

  </div>

</div>

<script>
const BASE = "https://hp-traders-v5ey.onrender.com";
const CLIENT_ID = "YOUR_CLIENT_ID";

/* LOGIN */
function login() {
  const verifier = crypto.randomUUID();
  const challenge = btoa(verifier).replace(/\W/g, "");

  window.location.href =
    `https://auth.deriv.com/oauth2/auth` +
    `?response_type=code` +
    `&client_id=${CLIENT_ID}` +
    `&redirect_uri=${BASE}/callback` +
    `&scope=trade+account_manage` +
    `&state=${verifier}` +
    `&code_challenge=${challenge}` +
    `&code_challenge_method=S256`;
}

/* PRICE STREAM */
const es = new EventSource(`${BASE}/api/price-stream`);

es.onmessage = (e) => {
  const data = JSON.parse(e.data);
  document.getElementById("price").innerText = "Price: " + data.price;
};

/* TRADE */
function trade(type) {
  fetch(`${BASE}/api/trade`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      amount: 10,
      contract_type: type
    })
  })
  .then(r => r.json())
  .then(d => alert(JSON.stringify(d)));
}
</script>

</body>
</html>
