<!DOCTYPE html>
<html>
<head>
<title>HP Traders Login</title>

<style>
body{
background:#041122;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.card{
background:#081a33;
padding:40px;
border-radius:20px;
text-align:center;
color:white;
}

button{
padding:15px 30px;
border:none;
border-radius:20px;
background:#00ff88;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>Login with Deriv</h2>

<button onclick="loginDeriv()">
Connect Deriv Account
</button>

</div>

<script>

function loginDeriv() {
  const appId = "1089";
  const redirectUri = "https://hp-traders-v5ey.onrender.com/callback";
  const state = crypto.randomUUID();

  localStorage.setItem("deriv_state", state);

  window.location.href =
    `https://auth.deriv.com/oauth2/authorize?` +
    `response_type=code` +
    `&app_id=${appId}` +
    `&redirect_uri=${encodeURIComponent(redirectUri)}` +
    `&state=${state}`;
}
</script>

</body>
</html>
